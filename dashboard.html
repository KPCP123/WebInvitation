<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Montessa's Five Decades — RSVP dashboard</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/favicon.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>

  <main class="dashboard">

    <header class="dashboard-header">
      <h1 class="dashboard-title">Montessa's Five Decades</h1>
      <p class="dashboard-subtitle">RSVP dashboard</p>
    </header>

    <!-- Summary counts -->
    <section class="summary" aria-label="Response summary">
      <div class="summary-card">
        <span class="summary-card__number" id="totalCount">0</span>
        <span class="summary-card__label">Total responses</span>
      </div>
      <div class="summary-card summary-card--accepted">
        <span class="summary-card__number" id="acceptedCount">0</span>
        <span class="summary-card__label">Accepted</span>
      </div>
      <div class="summary-card summary-card--declined">
        <span class="summary-card__number" id="declinedCount">0</span>
        <span class="summary-card__label">Declined</span>
      </div>
    </section>

    <!-- Toolbar -->
    <section class="toolbar">
      <input type="text" id="searchInput" class="toolbar-search" placeholder="Search by name" />
      <div class="toolbar-filters" role="group" aria-label="Filter by response">
        <button type="button" class="filter-btn is-active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="accepted">Accepted</button>
        <button type="button" class="filter-btn" data-filter="declined">Declined</button>
      </div>
    </section>

    <!-- Guest list -->
    <section class="guest-list-wrap">
      <table class="guest-list">
        <thead>
          <tr>
            <th>Guest</th>
            <th>Response</th>
            <th>Responded</th>
          </tr>
        </thead>
        <tbody id="guestListBody">
          <!-- Rows injected by dashboard.js -->
        </tbody>
      </table>

      <p class="empty-state" id="emptyState">No responses yet — once a guest accepts or declines on the invite page, they'll show up here.</p>
    </section>

    <footer class="dashboard-footer">
      <button type="button" id="refreshBtn" class="btn btn-ghost">Refresh</button>
      <button type="button" id="clearBtn" class="btn btn-ghost btn-danger">Clear all responses</button>
    </footer>

  </main>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
